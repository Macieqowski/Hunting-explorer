name: iOS app

# Checks that the iPhone app (ios/) still compiles: builds it for the iOS simulator, unsigned.
# Installing on a phone is done from Xcode on a Mac (docs/ios.md).

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web build + copy into ios/
        run: npm run ios:sync
      - name: Xcode version
        run: xcodebuild -version
      - name: Check Puwg92.swift (offline photo reprojection) against the Android test values
        run: |
          xcrun swiftc -O ios/App/App/Puwg92.swift ios/Tests/main.swift -o "$RUNNER_TEMP/puwg"
          "$RUNNER_TEMP/puwg"
      - name: Build for the simulator
        run: |
          # A scheme build (not -target): only it links the plugins' binary Swift packages.
          xcodebuild -project ios/App/App.xcodeproj -list
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E 'error:|warning: .*(BackgroundLocation|PositionPublisher|ViewController)|BUILD' | head -n 80
          test "${PIPESTATUS[0]}" -eq 0
      - name: Start the app in a simulator and check that its plugins are there
        timeout-minutes: 15
        run: |
          # Compiling is not enough: the plugins only exist if the app's ViewController registers them.
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          # No "bootstatus": on the runners it can wait many minutes for data migration
          # (locationd). Installing works as soon as the device is up.
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          for i in $(seq 1 90); do xcrun simctl install "$UDID" "$APP" 2>/dev/null && break; sleep 5; done
          xcrun simctl install "$UDID" "$APP"
          LOG="$RUNNER_TEMP/app.log"
          xcrun simctl launch --console-pty "$UDID" org.polowanie.app > "$LOG" 2>&1 &
          for i in $(seq 1 240); do grep -q '\[polowanie\] plugins' "$LOG" && break; sleep 1; done
          kill %1 2>/dev/null || true
          grep -E 'polowanie|error|Error' "$LOG" | head -n 40 || true
          line=$(grep '\[polowanie\] plugins' "$LOG" || true)
          test -n "$line" || { echo "::error::The app did not start (no plugins line in its console)"; exit 1; }
          for p in BackgroundLocation Alerts Compass Printer Speech Voice Bars TileDownload Gps; do
            echo "$line" | grep -q "$p" || { echo "::error::Plugin $p is missing in the iPhone app"; exit 1; }
          done
          echo "All plugins there: $line"
