<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interaktywna mapa obwodów łowieckich i kół łowieckich w Polsce – dane z Banku Danych o Lasach." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231e5a3a' d='M12 2 4 14h4l-3 5h6v3h2v-3h6l-3-5h4z'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1e5a3a" />
    <script>
      // The saved look (or the system one) before the first paint; src/theme.ts keeps it up to date.
      (function () {
        var dark = false;
        try {
          var pref = localStorage.getItem('theme');
          dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101412');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Polowanie" />
    <title>Polowanie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
