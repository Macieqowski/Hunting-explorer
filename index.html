<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interaktywna mapa obwodów łowieckich i kół łowieckich w Polsce – dane z Banku Danych o Lasach." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231e5a3a' d='M16 2c6.1 0 11 4.7 11 10.6 0 7.4-8.3 15.1-11 17.4-2.7-2.3-11-10-11-17.4C5 6.7 9.9 2 16 2Z'/%3E%3Cpath fill='%23fff' d='M16 6l-5 7h2.6l-3.6 5h5v3h2v-3h5l-3.6-5H21z'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1e5a3a" />
    <script>
      // The saved look (or the system one) before the first paint; src/theme.ts keeps it up to date.
      (function () {
        var dark = false;
        try {
          var pref = localStorage.getItem('theme');
          dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101412');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Polowanie" />
    <title>Polowanie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
